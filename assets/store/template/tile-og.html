<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      /* Social/OG card — marquee brand block at 1.91:1, no conversion card.
         Single centered column, so type runs larger than the marquee: this
         image is usually viewed at ~500px wide in a link preview. */
      .og-wrap {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 26px;
        padding: 0 80px;
      }
      .og-brand {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .og-brand img.logo {
        height: 92px;
        width: auto;
        display: block;
        flex: none;
        filter: drop-shadow(0 14px 26px rgba(67, 56, 202, 0.2));
      }
      .og-brand .name {
        font-family: var(--display);
        font-weight: 700;
        font-size: 62px;
        letter-spacing: -0.02em;
        color: var(--ink);
      }
      .og-tag {
        font-family: var(--display);
        font-weight: 600;
        font-size: 52px;
        line-height: 1.12;
        letter-spacing: -0.02em;
        color: var(--ink);
      }
      .og-tag .grad {
        background: linear-gradient(120deg, var(--indigo-deep) 0%, var(--indigo) 44%, var(--teal) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .og-sub {
        font-family: var(--text);
        font-weight: 500;
        font-size: 23px;
        color: var(--ink-2);
        line-height: 1.45;
        max-width: 800px;
      }
      .og-chips {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .og-chips .chip {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-family: var(--text);
        font-weight: 600;
        font-size: 17px;
        color: var(--ink-2);
        background: #fff;
        border: 1px solid var(--border);
        padding: 9px 17px;
        border-radius: 999px;
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.07);
      }
      .og-chips .chip .ic {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex: none;
        background: linear-gradient(135deg, var(--teal), var(--indigo));
      }

      .wm {
        position: absolute;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-weight: 600;
        color: rgba(79, 70, 229, 0.05);
        white-space: nowrap;
        letter-spacing: 0.04em;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="stage" style="width:1200px;height:630px">
      <div
        class="blob"
        style="width:440px;height:440px;right:-90px;top:-170px;background:radial-gradient(circle,rgba(99,102,241,.28),transparent 70%)"
      ></div>
      <div
        class="blob"
        style="width:400px;height:400px;left:-130px;bottom:-160px;background:radial-gradient(circle,rgba(20,184,166,.26),transparent 70%)"
      ></div>
      <div class="wm" style="left:52px;top:34px;font-size:30px">1718223245000</div>
      <div class="wm" style="right:44px;bottom:30px;font-size:30px">1_714_000_000</div>

      <div class="og-wrap">
        <div class="og-brand">
          <img class="logo" src="img/logo-transparent.png" alt="" />
          <span class="name">Epoch&nbsp;Buddy</span>
        </div>
        <div class="og-tag">Unix timestamps →<br /><span class="grad">human-readable dates</span>, instantly.</div>
        <div class="og-sub">
          Highlight any epoch on any page, or convert both ways from the popup — seconds &amp; milliseconds,
          multi-timezone, relative time. 100% local.
        </div>
        <div class="og-chips">
          <span class="chip"><span class="ic"></span>Highlight-to-convert</span>
          <span class="chip"><span class="ic"></span>Multi-timezone</span>
          <span class="chip"><span class="ic"></span>Works offline · free</span>
        </div>
      </div>
    </div>
  </body>
</html>
